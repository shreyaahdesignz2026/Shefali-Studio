<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../../assets/img/logo-mark.png">
<link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <strong>Shreyaah's Bliss Trails — Admin</strong>
    <nav>
      <a href="../products/">Products</a>
      <a href="../orders/">Orders</a>
      <a href="../services/">Services</a>
      <a href="../enquiries/">Enquiries</a>
      <a href="../events/">Events</a>
      <a href="../artisoul-tribe/">Artisoul Tribe</a>
      <a href="../gift-cards/">Gift Cards</a>
      <a href="../members/" class="is-active">Members</a>
      <a href="../admins/">Admins</a>
      <a href="#" id="logout-link">Log out</a>
    </nav>
  </header>

  <main class="admin-main">
    <div class="admin-card">
      <h2 style="margin-top:0">Create a member</h2>
      <form id="add-member-form">
        <div class="admin-form-row">
          <label for="new-email">Email</label>
          <input id="new-email" type="email" required>
        </div>
        <div class="admin-form-row">
          <label for="new-display-name">Display name</label>
          <input id="new-display-name" type="text">
        </div>
        <div class="admin-form-row">
          <label for="new-phone">Phone</label>
          <input id="new-phone" type="tel">
        </div>
        <div class="admin-form-row">
          <label for="new-password">Password (optional — leave blank to auto-generate)</label>
          <input id="new-password" type="text" minlength="8" placeholder="At least 8 characters">
        </div>
        <div class="admin-form-row">
          <label for="new-plan">Membership plan</label>
          <select id="new-plan">
            <option value="free_tier">Free Tier</option>
            <option value="artisoul_member">Artisoul Member</option>
          </select>
        </div>
        <button class="admin-btn" type="submit">Create</button>
        <p class="admin-error" id="add-error" hidden></p>
        <p class="admin-note" id="add-success" hidden></p>
      </form>
    </div>

    <div class="admin-card">
      <h2 style="margin-top:0">Members</h2>
      <p class="admin-note">Click a row to edit their plan/profile, reset their login, or see their addresses and orders.</p>
      <div style="overflow-x:auto">
        <table class="admin-table">
          <thead>
            <tr><th>#</th><th>Email</th><th>Display Name</th><th>Plan</th><th>Joined</th></tr>
          </thead>
          <tbody id="member-rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../assets/js/admin-common.js"></script>
  <script src="../../assets/js/admin-members.js"></script>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
