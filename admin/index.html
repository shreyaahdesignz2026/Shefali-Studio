<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — Shreyaah's Bliss Trails</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/logo-mark.png">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-main" style="max-width:380px;margin-top:4rem">
    <div class="admin-card">
      <h1 style="font-size:1.2rem;margin-top:0">Admin Login</h1>
      <form id="login-form">
        <div class="admin-form-row">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="username">
        </div>
        <div class="admin-form-row">
          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="current-password">
        </div>
        <button class="admin-btn" type="submit" style="width:100%">Log in</button>
        <p class="admin-error" id="login-error" hidden></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/admin-common.js"></script>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var errorEl = document.getElementById('login-error');

      if (new URLSearchParams(window.location.search).get('error') === 'not-admin') {
        errorEl.textContent = 'That account is not an admin account. Log in with an admin account instead.';
        errorEl.hidden = false;
      }

      window.SBTAdmin.client.auth.getSession().then(function (res) {
        var session = res.data && res.data.session;
        if (!session) return;
        window.SBTAdmin.checkIsAdmin(session).then(function (isAdmin) {
          if (isAdmin) window.location.href = '/admin/products/';
          else window.SBTAdmin.client.auth.signOut();
        });
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.hidden = true;
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        window.SBTAdmin.client.auth
          .signInWithPassword({ email: email, password: password })
          .then(function (res) {
            if (res.error) {
              errorEl.textContent = res.error.message;
              errorEl.hidden = false;
              return;
            }
            window.SBTAdmin.checkIsAdmin(res.data.session).then(function (isAdmin) {
              if (!isAdmin) {
                window.SBTAdmin.client.auth.signOut().then(function () {
                  errorEl.textContent = 'That account is not an admin account. Log in with an admin account instead.';
                  errorEl.hidden = false;
                });
                return;
              }
              window.location.href = '/admin/products/';
            });
          });
      });
    })();
  </script>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
